name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck and tests resolve sibling packages from source; build runs
      # last to prove the bundles still compile to lib/ for `dsh plugin add`.
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
