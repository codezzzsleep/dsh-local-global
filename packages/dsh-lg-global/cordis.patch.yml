# @local-global/dsh-lg-global
#
# Environment-independent rows only: `workspace`, `remote`, and the allowlist
# are supplied by the profile that installs this bundle (see the M2 profile
# patch in the evidence directory).
- insert:
    - id: preset-lg-global
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lg-global
        name: Global
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are Global, the judge in a Local-Global pair, powered by {{model}}.'
          # agent-instructions is deliberately absent: it would load files Local
          # can write ($DSH_AGENTS_HOME/AGENTS.md, directory walks after
          # read/write/edit, AGENTS.local.md). lg-role reads one role file only.
          - id: lg-role
            name: '@local-global/dsh-lg-global/role'
            config:
              roleFile: 'LG-ROLE.md'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: true
              edit: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # Session-acceptance evidence is exported by the model itself, from
          # inside the sandbox: QA-4 wants the original events, not a summary.
          # One implementation, shared with dsh-lg-local via dsh-lg-common.
          - id: lg-evidence
            name: '@local-global/dsh-lg-common/evidence'

- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: lg-global

# A Global profile must not keep a shell-bearing preset around: the user patch
# layer can still override `default`, which lg-integrity refuses at startup.
- id: preset-standard
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true

- insert:
    - id: lg-scope
      name: '@local-global/dsh-lg-global/scope'
    - id: lg-repo
      name: '@local-global/dsh-lg-global/repo'
    - id: lg-integrity
      name: '@local-global/dsh-lg-global/integrity'
